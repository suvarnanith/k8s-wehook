apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook
  namespace: webhook-system
  labels:
    app: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook
  template:
    metadata:
      labels:
        app: webhook
    spec:
      imagePullSecrets:
        - name: default-secret
      containers:
        - name: webhook
          image: webhook:1.0
          ports:
            - name: https
              containerPort: 9443
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: webhook-tls
            items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: webhook
                topologyKey: kubernetes.io/hostname
